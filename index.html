<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grab" />
    <meta name="description" content="Grab public media for personal offline use." />
    <meta property="og:title" content="Grab — Public media downloader" />
    <meta property="og:description" content="Fetch and download public media." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>GRAB — PUBLIC MEDIA TOOL</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('grab-theme');
          if (['system', 'light', 'dark'].includes(saved)) preference = saved;
        } catch {}
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = preference === 'system' ? (dark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#191917' : '#f4f0e7';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
