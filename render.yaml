services:
  - type: web
    name: grab
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: MAX_PLAYLIST_ITEMS
        value: "50"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_FILE_MB
        value: "500"
      - key: JOB_TTL_MIN
        value: "15"
      - key: SIGNATURE_TEXT
        value: "Made with love by Ranjeet Prajapati"
      - key: INFO_REQUESTS_PER_MIN
        value: "10"
      - key: DOWNLOAD_JOBS_PER_10_MIN
        value: "3"
      - key: SAVE_REQUESTS_PER_10_MIN
        value: "240"
      - key: COOKIES_B64
        sync: false
